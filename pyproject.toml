[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-802.11"
version = "0.1.0"
description = "Wireless access point time-series collector"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.19,<2", "ruff>=0.15,<1"]

[project.scripts]
"survey-802.11" = "commands:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["commands", "config", "control", "model", "runtime", "scan_parser", "scanner", "storage"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
exclude = ["^build/", "^dist/"]
